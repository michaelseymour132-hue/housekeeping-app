<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - Housekeeping Hub</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
</head>
<body>
  <div class="app">
    <main class="main">
      <div class="page-head"><div class="titles"><div class="breadcrumb" id="dateline">Today</div><h1>My Tasks</h1></div></div>
      <div class="card mb16" id="topCard">
        <div class="row wrap">
          <div class="grow"><strong id="progText">0 of 0 rooms</strong> <span class="small muted" id="credText"></span></div>
          <button class="btn btn-secondary btn-sm" id="breakBtn">Go on break</button>
          <button class="btn btn-danger btn-sm" id="helpBtn">Need assistance</button>
        </div>
        <div class="progress mt8"><span id="progBar" style="width:0%"></span></div>
        <div id="breakNote" class="instr hidden">You are on break. Your supervisor can see this. Tap "Back from break" when you return.</div>
      </div>
      <div id="skeleton"><div class="card skeleton" style="height:120px;"></div></div>
      <div id="list"></div>
      <div id="empty" class="empty hidden"><div class="empty-icon">&#10003;</div><div>No rooms on your sheet today. Check with your supervisor.</div></div>
    </main>
  </div>
  <div id="toast-host"></div>
  <div id="modal-host"></div>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/hk-model.js"></script>
  <script>
  (function () {
    var uid = null, tasks = [], roomsById = {}, onBreak = false, openId = null, tick = null, unsubT = null, unsubR = null;
    var TS = function () { return firebase.firestore.FieldValue.serverTimestamp(); };

    HK.requireAuth(["admin", "supervisor", "housekeeper"], function (state) {
      if (!state.hotelId) { window.location.href = "onboarding.html"; return; }
      uid = state.user.uid;
      HK.mount("mytasks");
      document.getElementById("dateline").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
      onBreak = !!(state.profile.live && state.profile.live.onBreak);
      paintBreak();
      start();
    });
    window.addEventListener("beforeunload", function () { if (unsubT) { unsubT(); } if (unsubR) { unsubR(); } });
    document.getElementById("breakBtn").onclick = toggleBreak;
    document.getElementById("helpBtn").onclick = function () { assistModal(null); };

    function start() {
      unsubT = HK.col("assignments").where("date", "==", HK.todayStr()).where("assignedToUid", "==", uid).onSnapshot(function (snap) {
        tasks = []; snap.forEach(function (d) { var t = d.data(); t.id = d.id; tasks.push(t); });
        document.getElementById("skeleton").className = "hidden";
        render();
      }, function (err) { document.getElementById("skeleton").className = "hidden"; HK.toast("Could not load your tasks: " + err.message, "error"); });
      unsubR = HK.col("rooms").where("active", "==", true).onSnapshot(function (snap) {
        roomsById = {}; snap.forEach(function (d) { var r = d.data(); r.id = d.id; roomsById[d.id] = r; }); render();
      }, function () {});
    }

    function rank(t) {
      if (t.status === "inprogress") { return 0; }
      if (t.status === "pending") { return t.type === "reclean" ? 1 : (t.priority ? 2 : 3); }
      if (t.status === "dnd") { return 4; }
      return 5;
    }
    function sorted() {
      return tasks.slice().sort(function (a, b) {
        var d = rank(a) - rank(b); if (d) { return d; }
        return (a.seq || 999) - (b.seq || 999) || HK.roomCompare(a, b);
      });
    }

    function paintBreak() {
      document.getElementById("breakBtn").textContent = onBreak ? "Back from break" : "Go on break";
      document.getElementById("breakBtn").className = "btn btn-sm " + (onBreak ? "btn-accent" : "btn-secondary");
      document.getElementById("breakNote").className = onBreak ? "instr" : "instr hidden";
    }
    function setLive(data) {
      var live = { onBreak: onBreak, updatedAt: TS() };
      Object.keys(data || {}).forEach(function (k) { live[k] = data[k]; });
      return HK.orgRef().collection("users").doc(uid).update({ live: live }).catch(function () {});
    }
    function toggleBreak() {
      onBreak = !onBreak; paintBreak();
      var cur = tasks.filter(function (t) { return t.status === "inprogress"; })[0];
      setLive({ breakSince: onBreak ? TS() : null, roomNumber: cur ? cur.roomNumber : "", startedAt: cur ? (cur.startedAt || null) : null });
      HK.toast(onBreak ? "Enjoy your break." : "Welcome back.", "info");
    }

    function render() {
      var list = document.getElementById("list"); list.innerHTML = "";
      if (tick) { clearInterval(tick); tick = null; }
      var all = sorted();
      var real = all.filter(function (t) { return t.status !== "dnd" && t.status !== "declined"; });
      var done = all.filter(function (t) { return t.status === "complete"; });
      var crAll = all.reduce(function (s, t) { return s + (t.credits || 0); }, 0);
      var crDone = done.reduce(function (s, t) { return s + (t.credits || 0); }, 0);
      document.getElementById("progText").textContent = done.length + " of " + all.length + " rooms";
      document.getElementById("credText").textContent = crAll ? crDone + " of " + crAll + " credits" : "";
      document.getElementById("progBar").style.width = all.length ? Math.round(done.length / all.length * 100) + "%" : "0%";
      document.getElementById("empty").className = all.length ? "empty hidden" : "empty";
      if (!openId) { var first = all.filter(function (t) { return t.status === "inprogress" || t.status === "pending"; })[0]; openId = first ? first.id : null; }
      all.forEach(function (t) { list.appendChild(card(t)); });
      if (real.length && done.length === all.length && all.length) {
        var fin = document.createElement("div"); fin.className = "card mb16"; fin.innerHTML = "<h2>All done for today</h2><p class=\"muted small\">Every room on your sheet is finished. Let your supervisor know.</p>"; list.appendChild(fin);
      }
    }

    function card(t) {
      var r = roomsById[t.roomId] || {};
      var c = document.createElement("div"); c.className = "card mb16 task-card" + (t.status === "inprogress" ? " current" : "");
      c.id = "task-" + t.id;
      var head = document.createElement("div"); head.className = "row";
      var h = document.createElement("h2"); h.className = "grow"; h.textContent = "Room " + t.roomNumber; head.appendChild(h);
      var tb = document.createElement("span"); tb.className = "badge " + ((HK.TASKS[t.type] || {}).badge || "badge-grey"); tb.textContent = HK.taskLabel(t.type); head.appendChild(tb);
      c.appendChild(head);

      var meta = document.createElement("div"); meta.className = "task-meta";
      function chip(cls, text) { var s = document.createElement("span"); s.className = "badge " + cls; s.textContent = text; meta.appendChild(s); }
      if (t.priority || HK.isPriority(r)) { chip("badge-amber", "★ Priority"); }
      if (t.credits) { chip("badge-grey", t.credits + " credits"); }
      if (r.roomNumber) { chip("badge-grey", HK.FO_LABELS[HK.foState(r)]); }
      if (t.linen) { chip("badge-blue", "↻ Change linen"); }
      if (r.guestService === "dnd") { chip("badge-purple", "⛔ Do not disturb"); }
      if (r.guestService === "mur") { chip("badge-green", "✨ Make up room"); }
      var stLabel = { pending: "To do", inprogress: "In progress", complete: "Done", dnd: "DND - come back later", declined: "Service declined" }[t.status] || t.status;
      chip({ pending: "badge-grey", inprogress: "badge-amber", complete: "badge-green", dnd: "badge-purple", declined: "badge-grey" }[t.status] || "badge-grey", stLabel);
      c.appendChild(meta);
      if (t.instructions || r.instructions) { var ins = document.createElement("div"); ins.className = "instr"; ins.textContent = t.instructions || r.instructions; c.appendChild(ins); }

      var body = document.createElement("div"); body.className = "mt16";
      if (t.status === "pending") {
        var startBtn = btn("btn-accent btn-block btn-lg", t.type === "turndown" ? "Start turndown" : "Start room", function () { startTask(t, startBtn); });
        body.appendChild(startBtn);
        if (t.type !== "turndown") {
          var row = document.createElement("div"); row.className = "row wrap mt8";
          row.appendChild(btn("btn-secondary btn-sm", "⛔ Guest has DND", function () { guestService(t, "dnd"); }));
          row.appendChild(btn("btn-secondary btn-sm", "Guest declined service", function () { guestService(t, "declined"); }));
          body.appendChild(row);
        }
      } else if (t.status === "dnd" || t.status === "declined") {
        body.appendChild(btn("btn-secondary btn-block", "Try this room again", function () { retry(t); }));
      } else if (t.status === "inprogress") {
        var tm = document.createElement("div"); tm.className = "row";
        var lab = document.createElement("span"); lab.className = "small muted grow"; lab.textContent = "Time in room"; tm.appendChild(lab);
        var clock = document.createElement("span"); clock.className = "timer"; tm.appendChild(clock); body.appendChild(tm);
        function paintClock() {
          var s = t.startedAt && t.startedAt.toDate ? Math.max(0, Math.floor((Date.now() - t.startedAt.toDate().getTime()) / 1000)) : 0;
          clock.textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
        }
        paintClock(); tick = setInterval(paintClock, 1000);
        renderChecklist(body, t);
        var more = document.createElement("div"); more.className = "row wrap mt8";
        more.appendChild(btn("btn-secondary btn-sm", "Report a repair", function () { repairModal(t); }));
        more.appendChild(btn("btn-secondary btn-sm", "Lost property", function () { window.location.href = "lostfound.html?room=" + encodeURIComponent(t.roomNumber); }));
        more.appendChild(btn("btn-secondary btn-sm", "Found it vacant", function () { hkCheck(t, "vacant"); }));
        more.appendChild(btn("btn-secondary btn-sm", "Found it occupied", function () { hkCheck(t, "occupied"); }));
        more.appendChild(btn("btn-secondary btn-sm", "Need help here", function () { assistModal(t); }));
        body.appendChild(more);
      } else if (t.status === "complete") {
        var p = document.createElement("p"); p.className = "muted small"; p.textContent = "Finished " + HK.fmtDateTime(t.completedAt) + (t.durationMinutes ? " - " + t.durationMinutes + " min" : ""); body.appendChild(p);
      }
      c.appendChild(body);
      return c;
    }
    function btn(cls, text, fn) { var b = document.createElement("button"); b.className = "btn " + cls; b.textContent = text; b.onclick = fn; return b; }

    function startTask(t, b) {
      var other = tasks.filter(function (x) { return x.status === "inprogress" && x.id !== t.id; })[0];
      if (other) { HK.toast("Finish room " + other.roomNumber + " first.", "error"); return; }
      b.disabled = true; b.textContent = "Starting...";
      var batch = db.batch();
      batch.update(HK.col("assignments").doc(t.id), { status: "inprogress", startedAt: TS() });
      if (t.type !== "turndown") {
        var rd = { status: "inprogress", updatedAt: TS() };
        if ((roomsById[t.roomId] || {}).guestService === "mur") { rd.guestService = ""; }
        batch.update(HK.col("rooms").doc(t.roomId), rd);
      }
      batch.commit().then(function () {
        openId = t.id;
        if (onBreak) { onBreak = false; paintBreak(); }
        setLive({ roomNumber: t.roomNumber, roomId: t.roomId, startedAt: TS(), breakSince: null });
        HK.history(t.roomId, t.roomNumber, "clean", HK.taskLabel(t.type) + " started", t.id);
      }).catch(function (err) { b.disabled = false; b.textContent = "Start room"; HK.toast("Could not start: " + err.message, "error"); });
    }

    function guestService(t, gs) {
      var batch = db.batch();
      batch.update(HK.col("assignments").doc(t.id), { status: gs === "dnd" ? "dnd" : "declined" });
      batch.update(HK.col("rooms").doc(t.roomId), { guestService: gs, updatedAt: TS() });
      batch.commit().then(function () {
        HK.history(t.roomId, t.roomNumber, "statuschange", gs === "dnd" ? "Do not disturb - skipped for now" : "Guest declined service", t.id);
        HK.toast(gs === "dnd" ? "Room " + t.roomNumber + " moved to the end of your list." : "Service declined recorded for " + t.roomNumber + ".", "info");
      }).catch(function (err) { HK.toast("Could not save: " + err.message, "error"); });
    }
    function retry(t) {
      var batch = db.batch();
      batch.update(HK.col("assignments").doc(t.id), { status: "pending" });
      batch.update(HK.col("rooms").doc(t.roomId), { guestService: "", updatedAt: TS() });
      batch.commit().catch(function (err) { HK.toast("Could not save: " + err.message, "error"); });
    }
    function hkCheck(t, v) {
      HK.col("rooms").doc(t.roomId).update({ hkStatus: v, hkStatusAt: TS(), hkStatusBy: HK.state.profile.displayName || "", updatedAt: TS() }).then(function () {
        var r = roomsById[t.roomId] || {}; var copy = {}; Object.keys(r).forEach(function (k) { copy[k] = r[k]; }); copy.hkStatus = v;
        var disc = HK.discrepancy(copy);
        HK.history(t.roomId, t.roomNumber, "statuschange", "Housekeeping found the room " + v, t.id);
        HK.toast(disc ? "Recorded - that doesn't match the booking, so your supervisor has been flagged." : "Recorded - room found " + v + ".", disc ? "info" : "success");
      }).catch(function (err) { HK.toast("Could not save: " + err.message, "error"); });
    }

    function renderChecklist(body, t) {
      var cl = t.checklist || [];
      cl.forEach(function (c) {
        var row = document.createElement("label"); row.className = "checkitem";
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!c.done;
        cb.onchange = function () { c.done = cb.checked; upd(); };
        var span = document.createElement("span"); span.className = "grow"; span.textContent = c.item;
        row.appendChild(cb); row.appendChild(span); body.appendChild(row);
      });
      var note = document.createElement("textarea"); note.placeholder = "Note for your supervisor (optional)"; note.className = "mt8"; body.appendChild(note);
      var prog = document.createElement("p"); prog.className = "small muted mt8"; body.appendChild(prog);
      var doneBtn = btn("btn-accent btn-block btn-lg mt8", "Finish room", function () { completeTask(t, note.value, doneBtn); });
      body.appendChild(doneBtn);
      function upd() { prog.textContent = cl.filter(function (x) { return x.done; }).length + " of " + cl.length + " ticked"; }
      upd();
    }

    function completeTask(t, noteText, b) {
      var cl = t.checklist || [];
      var undone = cl.filter(function (x) { return !x.done; }).length;
      var go = undone ? HK.confirm("Leave " + undone + " unticked?", "Some checklist items are not ticked. Finish anyway?", "Finish anyway", false) : Promise.resolve(true);
      go.then(function (ok) {
        if (!ok) { return; }
        b.disabled = true; b.textContent = "Saving...";
        var mins = (t.startedAt && t.startedAt.toDate) ? Math.max(1, Math.round((Date.now() - t.startedAt.toDate().getTime()) / 60000)) : null;
        var batch = db.batch();
        batch.update(HK.col("assignments").doc(t.id), { status: "complete", completedAt: TS(), durationMinutes: mins, checklist: cl });
        if (t.type === "turndown") { batch.update(HK.col("rooms").doc(t.roomId), { turndown: "done", updatedAt: TS() }); }
        else { batch.update(HK.col("rooms").doc(t.roomId), { status: "clean", lastCleanedAt: TS(), updatedAt: TS() }); }
        batch.commit().then(function () {
          if (noteText && noteText.trim()) {
            HK.col("roomnotes").add({ roomId: t.roomId, roomNumber: t.roomNumber, text: noteText.trim().slice(0, 1000), category: "general", isMaintenanceIssue: false, photoUrls: [], createdByUid: uid, createdByName: HK.state.profile.displayName, createdAt: TS() }).catch(function () {});
          }
          HK.history(t.roomId, t.roomNumber, "clean", HK.taskLabel(t.type) + " finished" + (mins ? " in " + mins + " min" : ""), t.id);
          setLive({ roomNumber: "", roomId: "", startedAt: null });
          var next = sorted().filter(function (x) { return x.status === "pending" && x.id !== t.id; })[0];
          openId = next ? next.id : null;
          HK.toast("Room " + t.roomNumber + " finished." + (next ? " Next: room " + next.roomNumber + "." : ""), "success");
          if (next) { setTimeout(function () { var el = document.getElementById("task-" + next.id); if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); } }, 300); }
        }).catch(function (err) { b.disabled = false; b.textContent = "Finish room"; HK.toast("Could not finish: " + err.message, "error"); });
      });
    }

    function modal(title, build, okLabel, onOk) {
      var host = document.getElementById("modal-host"); host.innerHTML = "";
      var back = document.createElement("div"); back.className = "modal-backdrop";
      var box = document.createElement("div"); box.className = "modal";
      var h = document.createElement("h2"); h.textContent = title; box.appendChild(h);
      build(box);
      var acts = document.createElement("div"); acts.className = "modal-actions";
      var cancel = btn("btn-secondary", "Cancel", function () { host.innerHTML = ""; });
      var ok = btn("btn-accent", okLabel, function () { onOk(ok, function () { host.innerHTML = ""; }); });
      back.onclick = function (e) { if (e.target === back) { host.innerHTML = ""; } };
      acts.appendChild(cancel); acts.appendChild(ok); box.appendChild(acts); back.appendChild(box); host.appendChild(back);
    }

    function repairModal(t) {
      var cat, txt;
      modal("Report a repair - room " + t.roomNumber, function (box) {
        var l1 = document.createElement("label"); l1.textContent = "What kind?"; box.appendChild(l1);
        cat = document.createElement("select");
        [["damage", "Broken or damaged"], ["stock", "Missing stock"], ["guestrequest", "Guest request"], ["general", "Other"]].forEach(function (p) { var o = document.createElement("option"); o.value = p[0]; o.textContent = p[1]; cat.appendChild(o); });
        box.appendChild(cat);
        var l2 = document.createElement("label"); l2.className = "mt8"; l2.textContent = "What's wrong?"; box.appendChild(l2);
        txt = document.createElement("textarea"); txt.maxLength = 1000; txt.placeholder = "e.g. Bathroom tap dripping"; box.appendChild(txt);
      }, "Send report", function (ok, close) {
        var text = txt.value.trim(); if (!text) { HK.toast("Say what's wrong.", "error"); return; }
        ok.disabled = true;
        HK.col("roomnotes").add({ roomId: t.roomId, roomNumber: t.roomNumber, text: text, category: cat.value, isMaintenanceIssue: true, maintenanceStatus: "open", photoUrls: [], createdByUid: uid, createdByName: HK.state.profile.displayName, createdAt: TS() }).then(function () {
          HK.history(t.roomId, t.roomNumber, "maintenance", "Issue reported: " + text.slice(0, 60), null);
          HK.toast("Repair reported.", "success"); close();
        }).catch(function (err) { ok.disabled = false; HK.toast("Could not send: " + err.message, "error"); });
      });
    }

    function assistModal(t) {
      var txt;
      modal(t ? "Need help - room " + t.roomNumber : "Need assistance", function (box) {
        var p = document.createElement("p"); p.className = "small muted mb8"; p.textContent = "Your supervisor sees this straight away on the Attendant console."; box.appendChild(p);
        txt = document.createElement("textarea"); txt.maxLength = 300; txt.placeholder = "e.g. Need a second pair of hands to turn a mattress"; box.appendChild(txt);
      }, "Send", function (ok, close) {
        var msg = txt.value.trim() || "Needs assistance";
        ok.disabled = true;
        var cur = t || tasks.filter(function (x) { return x.status === "inprogress"; })[0];
        HK.col("alerts").add({ type: "assistance", message: msg.slice(0, 300), roomNumber: cur ? cur.roomNumber : "", roomId: cur ? cur.roomId : "",
                              fromUid: uid, fromName: HK.state.profile.displayName || "", status: "open", createdAt: TS() }).then(function () {
          HK.toast("Help requested - your supervisor has been told.", "success"); close();
        }).catch(function (err) { ok.disabled = false; HK.toast("Could not send: " + err.message, "error"); });
      });
    }
  })();
  </script>
</body>
</html>
