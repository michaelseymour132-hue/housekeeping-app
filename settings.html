<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Housekeeping Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <style> .tabs-nav{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto} .tabs-nav button{min-height:40px;background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap} .tabs-nav button.active{color:var(--accent-dark);border-bottom-color:var(--accent)} </style>
</head>
<body>
  <div class="app">
    <main class="main">
      <div class="page-head"><div class="titles"><div class="breadcrumb">Housekeeping Hub</div><h1>Settings</h1></div></div>
      <div class="tabs-nav">
        <button data-t="hotel" class="active">Hotel</button><button data-t="checklists">Checklists</button><button data-t="hk">Housekeeping</button><button data-t="rooms">Rooms</button><button data-t="users">Users</button><button data-t="branding">Branding</button><button data-t="export">Data export</button><button data-t="audit">Audit log</button>
      </div>
      <div id="pane">Loading...</div>
    </main>
  </div>
  <div id="toast-host"></div>
  <div id="modal-host"></div>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/hk-model.js"></script>
  <script>
  (function () {
    var hotel = null, cur = "hotel";
    HK.requireAuth(["admin"], function (state) {
      if (!state.hotelId) { window.location.href = "onboarding.html"; return; }
      HK.mount("settings");
      HK.hotelRef().get().then(function (h) { hotel = h.data(); hotel.settings = hotel.settings || {}; render(); }).catch(function (err) { document.getElementById("pane").innerHTML = "<p class=\"muted\">" + HK.esc(err.message) + "</p>"; });
    });
    var btns = document.querySelectorAll(".tabs-nav button");
    for (var i = 0; i < btns.length; i++) { btns[i].onclick = (function (b) { return function () { cur = b.getAttribute("data-t"); setActive(); render(); }; })(btns[i]); }
    function setActive() { var bs = document.querySelectorAll(".tabs-nav button"); for (var j = 0; j < bs.length; j++) { bs[j].className = (bs[j].getAttribute("data-t") === cur) ? "active" : ""; } }
    function render() { var p = document.getElementById("pane"); if (!hotel) { p.innerHTML = "Loading..."; return; } p.innerHTML = ""; if (cur === "hotel") { renderHotel(p); } else if (cur === "checklists") { renderChecklists(p); } else if (cur === "hk") { renderHk(p); } else if (cur === "rooms") { renderRooms(p); } else if (cur === "users") { renderUsers(p); } else if (cur === "branding") { renderBranding(p); } else if (cur === "export") { renderExport(p); } else if (cur === "audit") { renderAudit(p); } }
    function renderHotel(p) {
      var c = document.createElement("div"); c.className = "card";
      c.innerHTML = "<div class=\"card-title\">Hotel details</div><div class=\"field\"><label>Name</label><input id=\"hName\" value=\"" + HK.esc(hotel.name) + "\"></div><div class=\"field\"><label>Address</label><input id=\"hAddr\" value=\"" + HK.esc(hotel.address || "") + "\"></div><div class=\"field-row\"><div class=\"field\"><label>Floors</label><input id=\"hFloors\" type=\"number\" value=\"" + (hotel.floorsCount || 1) + "\"></div><div class=\"field\"><label>Deep clean interval (days)</label><input id=\"hInterval\" type=\"number\" value=\"" + (hotel.settings.deepCleanIntervalDays || 90) + "\"></div></div><button class=\"btn btn-accent\" id=\"saveHotel\">Save</button>";
      p.appendChild(c);
      document.getElementById("saveHotel").onclick = function () { var btn = this; btn.disabled = true; btn.textContent = "Saving..."; HK.hotelRef().update({ name: document.getElementById("hName").value.trim(), address: document.getElementById("hAddr").value.trim(), floorsCount: parseInt(document.getElementById("hFloors").value, 10) || 1, "settings.deepCleanIntervalDays": parseInt(document.getElementById("hInterval").value, 10) || 90 }).then(function () { hotel.name = document.getElementById("hName").value.trim(); HK.audit("settings.changed", "Hotel details updated"); HK.toast("Saved.", "success"); btn.disabled = false; btn.textContent = "Save"; }).catch(function (err) { btn.disabled = false; btn.textContent = "Save"; HK.toast("Save failed: " + err.message, "error"); }); };
    }
    function renderHk(p) {
      var st = HK.hkSettings(hotel);
      var c = document.createElement("div"); c.className = "card";
      var title = document.createElement("div"); title.className = "card-title"; title.textContent = "Task sheet credits"; c.appendChild(title);
      var help = document.createElement("p"); help.className = "small muted mb16";
      help.textContent = "Credits measure how much work a job is (like OPERA). Task sheets share rooms out so each attendant gets a fair number of credits. A rough guide: 1 credit = about 10 minutes.";
      c.appendChild(help);
      var grid = document.createElement("div"); grid.className = "field-row"; grid.style.flexWrap = "wrap"; c.appendChild(grid);
      var inputs = {};
      ["departure", "stayover", "pickup", "turndown", "reclean", "deepclean"].forEach(function (k) {
        var f = document.createElement("div"); f.className = "field"; f.style.minWidth = "140px";
        var l = document.createElement("label"); l.textContent = HK.taskLabel(k); f.appendChild(l);
        var i = document.createElement("input"); i.type = "number"; i.min = "0"; i.step = "0.5"; i.value = st.credits[k]; f.appendChild(i);
        inputs[k] = i; grid.appendChild(f);
      });
      var row = document.createElement("div"); row.className = "field-row"; c.appendChild(row);
      function num(labelText, val, hint) {
        var f = document.createElement("div"); f.className = "field";
        var l = document.createElement("label"); l.textContent = labelText; f.appendChild(l);
        var i = document.createElement("input"); i.type = "number"; i.min = "0"; i.value = val; f.appendChild(i);
        var h = document.createElement("div"); h.className = "tiny muted"; h.textContent = hint; f.appendChild(h);
        row.appendChild(f); return i;
      }
      var linen = num("Change stayover linen every (nights)", st.linenDays, "0 = never flag a linen change");
      var cap = num("Most credits on one task sheet", st.maxCredits, "0 = no limit");
      var save = document.createElement("button"); save.className = "btn btn-accent mt8"; save.textContent = "Save housekeeping settings"; c.appendChild(save);
      p.appendChild(c);
      save.onclick = function () {
        var credits = {}, bad = false;
        Object.keys(inputs).forEach(function (k) { var v = parseFloat(inputs[k].value); if (isNaN(v) || v < 0 || v > 50) { bad = true; } credits[k] = v; });
        credits.daily = credits.stayover;
        var ld = parseInt(linen.value, 10), mc = parseFloat(cap.value);
        if (bad || isNaN(ld) || ld < 0 || ld > 30 || isNaN(mc) || mc < 0 || mc > 500) { HK.toast("Check the numbers - credits 0-50, linen 0-30 nights, cap 0-500.", "error"); return; }
        save.disabled = true; save.textContent = "Saving...";
        var hk = { credits: credits, linenDays: ld, maxCredits: mc };
        HK.hotelRef().update({ "settings.hk": hk }).then(function () {
          hotel.settings = hotel.settings || {}; hotel.settings.hk = hk;
          HK.audit("settings.changed", "Housekeeping credits updated");
          HK.toast("Housekeeping settings saved.", "success"); save.disabled = false; save.textContent = "Save housekeeping settings";
        }).catch(function (err) { save.disabled = false; save.textContent = "Save housekeeping settings"; HK.toast("Save failed: " + err.message, "error"); });
      };
    }
    function renderChecklists(p) {
      var daily = (hotel.settings.dailyChecklist || []).slice(); var deep = (hotel.settings.deepCleanChecklist || []).slice();
      var c = document.createElement("div"); c.className = "card"; c.innerHTML = "<div class=\"card-title\">Daily clean checklist</div><div id=\"dailyL\"></div><div class=\"row mt8\"><input id=\"dailyN\" placeholder=\"Add task\"><button class=\"btn btn-secondary btn-sm\" id=\"addD\">Add</button></div>";
      var c2 = document.createElement("div"); c2.className = "card"; c2.innerHTML = "<div class=\"card-title\">Deep clean checklist</div><div id=\"deepL\"></div><div class=\"row mt8\"><input id=\"deepN\" placeholder=\"Add task\"><button class=\"btn btn-secondary btn-sm\" id=\"addDp\">Add</button></div>";
      var save = document.createElement("button"); save.className = "btn btn-accent mt16"; save.textContent = "Save checklists";
      p.appendChild(c); p.appendChild(c2); p.appendChild(save);
      function drawList(id, arr) { var host = document.getElementById(id); host.innerHTML = ""; arr.forEach(function (item, idx) { var row = document.createElement("div"); row.className = "checkitem"; var up = idx > 0 ? "<button class=\"btn btn-sm btn-secondary\" data-a=\"up\">\u2191</button>" : ""; row.innerHTML = "<span class=\"grow\">" + HK.esc(item) + "</span>"; var upB = document.createElement("button"); upB.className = "btn btn-sm btn-secondary"; upB.textContent = "Up"; upB.disabled = idx === 0; upB.onclick = function () { var t = arr[idx - 1]; arr[idx - 1] = arr[idx]; arr[idx] = t; drawList(id, arr); }; var del = document.createElement("button"); del.className = "btn btn-sm btn-danger"; del.textContent = "Remove"; del.onclick = function () { arr.splice(idx, 1); drawList(id, arr); }; row.appendChild(upB); row.appendChild(del); host.appendChild(row); }); }
      drawList("dailyL", daily); drawList("deepL", deep);
      document.getElementById("addD").onclick = function () { var v = document.getElementById("dailyN").value.trim(); if (v) { daily.push(v); document.getElementById("dailyN").value = ""; drawList("dailyL", daily); } };
      document.getElementById("addDp").onclick = function () { var v = document.getElementById("deepN").value.trim(); if (v) { deep.push(v); document.getElementById("deepN").value = ""; drawList("deepL", deep); } };
      save.onclick = function () { save.disabled = true; save.textContent = "Saving..."; HK.hotelRef().update({ "settings.dailyChecklist": daily, "settings.deepCleanChecklist": deep }).then(function () { hotel.settings.dailyChecklist = daily; hotel.settings.deepCleanChecklist = deep; HK.audit("settings.changed", "Checklists updated"); HK.toast("Checklists saved.", "success"); save.disabled = false; save.textContent = "Save checklists"; }).catch(function (err) { save.disabled = false; save.textContent = "Save checklists"; HK.toast("Save failed: " + err.message, "error"); }); };
    }
    function renderRooms(p) {
      var c = document.createElement("div"); c.className = "card"; c.innerHTML = "<div class=\"card-title\">Room manager</div><div class=\"field-row\"><div class=\"field\"><label>Room number</label><input id=\"rNum\"></div><div class=\"field\"><label>Floor</label><input id=\"rFloor\" type=\"number\" value=\"1\"></div><div class=\"field\"><label>Type</label><select id=\"rType\"><option>double</option><option>single</option><option>twin</option><option>suite</option><option>family</option><option>accessible</option></select></div></div><button class=\"btn btn-accent btn-sm\" id=\"addRoom\">Add room</button><div id=\"roomList\" class=\"mt16\">Loading...</div>";
      p.appendChild(c);
      document.getElementById("addRoom").onclick = function () { var num = document.getElementById("rNum").value.trim(); if (!num) { HK.toast("Enter a room number.", "error"); return; } HK.col("rooms").add({ roomNumber: num, floor: parseInt(document.getElementById("rFloor").value, 10) || 1, type: document.getElementById("rType").value, status: "clean", occupancy: "vacant", occStatus: "vacant", arrival: "", departure: "", guestName: "", bedConfig: "", notes: "", quirks: "", lastCleanedAt: null, lastDeepCleanAt: null, nextDeepCleanDue: null, photoUrls: [], active: true, createdAt: firebase.firestore.FieldValue.serverTimestamp(), updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).then(function () { HK.audit("room.created", "Room " + num); HK.toast("Room added.", "success"); document.getElementById("rNum").value = ""; loadRoomList(); }).catch(function (err) { HK.toast("Add failed: " + err.message, "error"); }); };
      loadRoomList();
      function loadRoomList() { HK.col("rooms").where("active", "==", true).get().then(function (snap) { var el = document.getElementById("roomList"); el.innerHTML = ""; var arr = []; snap.forEach(function (d) { var r = d.data(); r.id = d.id; arr.push(r); }); arr.sort(function (a, b) { return (a.roomNumber > b.roomNumber) ? 1 : -1; }); if (!arr.length) { el.innerHTML = "<p class=\"muted small\">No rooms.</p>"; return; } arr.forEach(function (r) { var row = document.createElement("div"); row.className = "checkitem"; row.innerHTML = "<span class=\"grow\">Room " + HK.esc(r.roomNumber) + " <span class=\"tiny muted\">" + HK.esc(r.type) + " - floor " + r.floor + "</span></span>"; var del = document.createElement("button"); del.className = "btn btn-sm btn-danger"; del.textContent = "Deactivate"; del.onclick = function () { HK.confirm("Deactivate room " + r.roomNumber + "?", "It will be hidden from boards but its history is kept.", "Deactivate", true).then(function (go) { if (!go) { return; } HK.col("rooms").doc(r.id).update({ active: false }).then(function () { HK.audit("room.deactivated", "Room " + r.roomNumber); HK.toast("Deactivated.", "success"); loadRoomList(); }).catch(function (err) { HK.toast("Failed: " + err.message, "error"); }); }); }; row.appendChild(del); el.appendChild(row); }); }).catch(function (err) { document.getElementById("roomList").innerHTML = "<p class=\"muted\">" + HK.esc(err.message) + "</p>"; }); }
    }
    function renderUsers(p) {
      // ---- Team link (PIN sign-in for housekeepers) ----
      var tl = document.createElement("div"); tl.className = "card mb16";
      tl.innerHTML = "<div class=\"card-title\">Team link for housekeepers</div>" +
        "<p class=\"small mb16\">Housekeepers do not need an email. Share this link or put the QR code up in the staff room: they open it, tap their name and type their PIN. Keep it private - anyone with the link sees your team's first names.</p>" +
        "<div id=\"tlBody\"><button class=\"btn btn-accent btn-sm\" id=\"tlShow\">Show team link and QR code</button></div>";
      p.appendChild(tl);
      document.getElementById("tlShow").onclick = function () { loadTeamLink(false, this); };

      // ---- Add a team member ----
      var c = document.createElement("div"); c.className = "card";
      c.innerHTML = "<div class=\"card-title\">Add a team member</div>" +
        "<div class=\"field\"><label for=\"uName\">Full name</label><input id=\"uName\" maxlength=\"60\" autocomplete=\"off\"></div>" +
        "<div class=\"field\"><label for=\"uRole\">Role</label><select id=\"uRole\"><option value=\"housekeeper\">Housekeeper</option><option value=\"supervisor\">Supervisor</option><option value=\"admin\">Admin</option></select></div>" +
        "<div class=\"field\" id=\"uTypeWrap\"><label for=\"uType\">How they sign in</label><select id=\"uType\"><option value=\"pin\">Team link and PIN (no email needed)</option><option value=\"email\">Email and password</option></select></div>" +
        "<div class=\"field\" id=\"uPinWrap\"><label for=\"uPin\">PIN (4 to 6 numbers) - tell them in person</label><input id=\"uPin\" inputmode=\"numeric\" maxlength=\"6\" autocomplete=\"off\" placeholder=\"e.g. 5829\"></div>" +
        "<div class=\"field hidden\" id=\"uEmailWrap\"><label for=\"uEmail\">Email</label><input id=\"uEmail\" type=\"email\" autocomplete=\"off\"></div>" +
        "<button class=\"btn btn-accent btn-sm\" id=\"addUser\">Create team member</button>" +
        "<div class=\"card-title mt16\">Your team</div><div id=\"userList\">Loading...</div>";
      p.appendChild(c);

      function syncType() {
        var role = document.getElementById("uRole").value;
        var typeWrap = document.getElementById("uTypeWrap");
        if (role !== "housekeeper") { document.getElementById("uType").value = "email"; typeWrap.className = "field hidden"; }
        else { typeWrap.className = "field"; }
        var pin = document.getElementById("uType").value === "pin";
        document.getElementById("uPinWrap").className = pin ? "field" : "field hidden";
        document.getElementById("uEmailWrap").className = pin ? "field hidden" : "field";
      }
      document.getElementById("uRole").onchange = function () { if (this.value === "housekeeper") { document.getElementById("uType").value = "pin"; } syncType(); };
      document.getElementById("uType").onchange = syncType;
      syncType();

      document.getElementById("addUser").onclick = function () {
        var btn = this;
        var name = document.getElementById("uName").value.trim();
        var role = document.getElementById("uRole").value;
        var type = role === "housekeeper" ? document.getElementById("uType").value : "email";
        var email = document.getElementById("uEmail").value.trim();
        var pin = document.getElementById("uPin").value.trim();
        if (!name) { HK.toast("Enter their name.", "error"); return; }
        if (type === "email" && !email) { HK.toast("Enter their email.", "error"); return; }
        if (type === "pin" && !/^[0-9]{4,6}$/.test(pin)) { HK.toast("A PIN is 4 to 6 numbers.", "error"); return; }
        btn.disabled = true; btn.textContent = "Creating...";
        var payload = { orgId: HK.state.orgId, hotelId: HK.state.hotelId, displayName: name, role: role, loginType: type };
        if (type === "pin") { payload.pin = pin; } else { payload.email = email; }
        callApi("/api/create-user", payload).then(function () {
          if (type === "email") { return auth.sendPasswordResetEmail(email).catch(function () {}); }
        }).then(function () {
          HK.audit("user.created", name + " (" + role + ", " + (type === "pin" ? "PIN" : "email") + ")");
          HK.toast(type === "pin" ? name + " is set up. They sign in from the team link with their PIN." : "User created. They have been emailed a link to set their password.", "success");
          document.getElementById("uName").value = ""; document.getElementById("uEmail").value = ""; document.getElementById("uPin").value = "";
          btn.disabled = false; btn.textContent = "Create team member";
          loadUserList();
        }).catch(function (err) { btn.disabled = false; btn.textContent = "Create team member"; HK.toast("Failed: " + err.message, "error"); });
      };
      loadUserList();

      function callApi(url, payload) {
        var user = firebase.auth().currentUser;
        if (!user) { return Promise.reject(new Error("Please sign in again.")); }
        return user.getIdToken().then(function (token) {
          return fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify(payload) });
        }).then(function (resp) {
          return resp.json().catch(function () { return {}; }).then(function (data) {
            if (!resp.ok) { throw new Error((data && data.error) || "Something went wrong."); }
            return data;
          });
        });
      }

      function loadTeamLink(rotate, btn) {
        if (btn) { btn.disabled = true; btn.textContent = rotate ? "Making a new link..." : "Loading..."; }
        callApi("/api/team", { action: "link", orgId: HK.state.orgId, hotelId: HK.state.hotelId, rotate: !!rotate }).then(function (d) {
          if (rotate) { HK.audit("teamlink.rotated", "New team link made"); HK.toast("New team link made. The old one no longer works.", "success"); }
          var body = document.getElementById("tlBody"); body.innerHTML = "";
          var wrap = document.createElement("div"); wrap.className = "row wrap"; wrap.style.alignItems = "flex-start"; wrap.style.gap = "20px";
          var qr = document.createElement("div"); qr.style.width = "170px"; qr.style.flex = "0 0 auto"; qr.innerHTML = d.qrSvg;
          var svg = qr.querySelector("svg"); if (svg) { svg.setAttribute("width", "170"); svg.setAttribute("height", "170"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "QR code for the team link"); }
          var right = document.createElement("div"); right.className = "grow"; right.style.minWidth = "220px";
          var inp = document.createElement("input"); inp.readOnly = true; inp.value = d.url; inp.setAttribute("aria-label", "Team link");
          inp.onclick = function () { this.select(); };
          var acts = document.createElement("div"); acts.className = "row wrap mt8";
          var copy = document.createElement("button"); copy.className = "btn btn-sm btn-accent"; copy.textContent = "Copy link";
          copy.onclick = function () {
            var done = function () { HK.toast("Team link copied.", "success"); };
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(d.url).then(done).catch(function () { inp.select(); document.execCommand("copy"); done(); }); }
            else { inp.select(); document.execCommand("copy"); done(); }
          };
          var print = document.createElement("button"); print.className = "btn btn-sm btn-secondary"; print.textContent = "Print staff-room poster";
          print.onclick = function () { printPoster(d); };
          acts.appendChild(copy); acts.appendChild(print);
          if (HK.state.profile.role === "admin") {
            var rot = document.createElement("button"); rot.className = "btn btn-sm btn-secondary"; rot.textContent = "Make a new link";
            rot.onclick = function () {
              HK.confirm("Make a new team link?", "The old link and printed QR codes stop working straight away. Use this if the link has been shared with someone who should not have it.", "Make new link", true).then(function (go) { if (go) { loadTeamLink(true, rot); } });
            };
            acts.appendChild(rot);
          }
          var hint = document.createElement("p"); hint.className = "tiny muted mt8";
          hint.textContent = "Tip: once a housekeeper has signed in, their phone remembers them. Add the page to the home screen so it opens like an app.";
          right.appendChild(inp); right.appendChild(acts); right.appendChild(hint);
          wrap.appendChild(qr); wrap.appendChild(right); body.appendChild(wrap);
        }).catch(function (err) {
          if (btn) { btn.disabled = false; btn.textContent = rotate ? "Make a new link" : "Show team link and QR code"; }
          HK.toast("Could not load the team link: " + err.message, "error");
        });
      }

      function printPoster(d) {
        var w = window.open("", "_blank");
        if (!w) { HK.toast("Allow pop-ups to print the poster.", "error"); return; }
        var prop = HK.esc((hotel && hotel.name) || "Our team");
        w.document.write("<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><title>Team sign in - " + prop + "</title>" +
          "<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#12222f;text-align:center}" +
          ".p{padding:56px 48px}h1{font-size:46px;margin:0 0 8px}h2{font-size:22px;margin:0 0 30px;color:#0b7673;font-weight:700}" +
          ".q svg{width:340px;height:340px}ol{text-align:left;display:inline-block;font-size:22px;line-height:1.7;margin:28px auto 0;padding-left:28px}" +
          ".f{margin-top:36px;font-size:14px;color:#46586a}@page{size:A4;margin:12mm}</style></head><body><div class=\"p\">" +
          "<h1>Housekeeping sign in</h1><h2>" + prop + "</h2><div class=\"q\">" + d.qrSvg + "</div>" +
          "<ol><li>Scan the code with your phone camera</li><li>Tap your name</li><li>Type your PIN</li></ol>" +
          "<div class=\"f\">Forgotten your PIN? Ask your supervisor to reset it. Please do not share this code outside the team.</div>" +
          "</div><script>window.onload=function(){window.print();};<\/script></body></html>");
        w.document.close();
      }

      function pinModal(u) {
        var host = document.getElementById("modal-host"); host.innerHTML = "";
        var back = document.createElement("div"); back.className = "modal-backdrop";
        var box = document.createElement("div"); box.className = "modal"; box.style.maxWidth = "380px";
        var h = document.createElement("h2"); h.textContent = "New PIN for " + u.displayName; box.appendChild(h);
        var pEl = document.createElement("p"); pEl.className = "small muted mb16"; pEl.textContent = "4 to 6 numbers. Tell them in person - it also unlocks them if they were locked out."; box.appendChild(pEl);
        var f = document.createElement("div"); f.className = "field";
        var l = document.createElement("label"); l.textContent = "New PIN"; l.setAttribute("for", "newPin");
        var inp = document.createElement("input"); inp.id = "newPin"; inp.inputMode = "numeric"; inp.maxLength = 6; inp.autocomplete = "off";
        f.appendChild(l); f.appendChild(inp); box.appendChild(f);
        var acts = document.createElement("div"); acts.className = "modal-actions";
        var cancel = document.createElement("button"); cancel.className = "btn btn-secondary"; cancel.textContent = "Cancel";
        var save = document.createElement("button"); save.className = "btn btn-accent"; save.textContent = "Save PIN";
        cancel.onclick = function () { host.innerHTML = ""; };
        back.onclick = function (e) { if (e.target === back) { host.innerHTML = ""; } };
        save.onclick = function () {
          var v = inp.value.trim();
          if (!/^[0-9]{4,6}$/.test(v)) { HK.toast("A PIN is 4 to 6 numbers.", "error"); return; }
          save.disabled = true; save.textContent = "Saving...";
          callApi("/api/team", { action: "setpin", orgId: HK.state.orgId, uid: u.uid, pin: v }).then(function () {
            HK.audit("user.pinreset", u.displayName);
            HK.toast("PIN updated for " + u.displayName + ".", "success"); host.innerHTML = "";
          }).catch(function (err) { save.disabled = false; save.textContent = "Save PIN"; HK.toast("Failed: " + err.message, "error"); });
        };
        acts.appendChild(cancel); acts.appendChild(save); box.appendChild(acts);
        back.appendChild(box); host.appendChild(back);
        setTimeout(function () { inp.focus(); }, 50);
      }

      function loadUserList() {
        HK.orgRef().collection("users").get().then(function (snap) {
          var el = document.getElementById("userList"); el.innerHTML = "";
          var arr = []; snap.forEach(function (d) { arr.push(d.data()); });
          arr.sort(function (a, b) { return String(a.displayName || "").toLowerCase() < String(b.displayName || "").toLowerCase() ? -1 : 1; });
          arr.forEach(function (u) {
            var row = document.createElement("div"); row.className = "checkitem";
            var how = u.loginType === "pin" ? "team link + PIN" : (u.email || "email");
            row.innerHTML = "<span class=\"grow\">" + HK.esc(u.displayName) + " <span class=\"tiny muted\">" + HK.esc(how) + " - " + HK.esc(u.role) + (u.active ? "" : " - inactive") + "</span></span>";
            if (u.loginType === "pin" && u.active) {
              var rp = document.createElement("button"); rp.className = "btn btn-sm btn-secondary"; rp.textContent = "Reset PIN";
              rp.onclick = function () { pinModal(u); }; row.appendChild(rp);
            }
            if (u.uid !== HK.state.user.uid) {
              var tog = document.createElement("button"); tog.className = "btn btn-sm btn-secondary"; tog.textContent = u.active ? "Deactivate" : "Reactivate";
              tog.onclick = function () { HK.orgRef().collection("users").doc(u.uid).update({ active: !u.active }).then(function () { HK.audit("user.updated", u.displayName + " active=" + (!u.active)); HK.toast("Updated.", "success"); loadUserList(); }).catch(function (err) { HK.toast("Failed: " + err.message, "error"); }); };
              row.appendChild(tog);
            }
            el.appendChild(row);
          });
        }).catch(function (err) { document.getElementById("userList").innerHTML = "<p class=\"muted\">" + HK.esc(err.message) + "</p>"; });
      }
    }
    function renderBranding(p) {
      var b = (HK.state.org && HK.state.org.branding) || {};
      var c = document.createElement("div"); c.className = "card"; c.innerHTML = "<div class=\"card-title\">Branding (white-label)</div><p class=\"small muted mb16\">Your app name, colour and logo appear across every page for your whole team.</p><div class=\"field\"><label>App name</label><input id=\"bName\" maxlength=\"40\" value=\"" + HK.esc(b.appName || "Housekeeping Hub") + "\"></div><div class=\"field\"><label>Primary colour</label><div class=\"row\"><input id=\"bPick\" type=\"color\" value=\"" + HK.esc(/^#[0-9a-fA-F]{6}$/.test(b.primaryColor || "") ? b.primaryColor : "#0e9591") + "\" style=\"width:56px;padding:2px\"><input id=\"bColor\" value=\"" + HK.esc(b.primaryColor || "#0e9591") + "\"></div></div><div class=\"field\"><label>Logo web address (https://...)</label><input id=\"bLogo\" value=\"" + HK.esc(b.logoUrl || "") + "\"></div><button class=\"btn btn-accent\" id=\"saveBrand\">Save branding</button>";
      p.appendChild(c);
      document.getElementById("bPick").oninput = function () { document.getElementById("bColor").value = this.value; };
      document.getElementById("saveBrand").onclick = function () {
        var btn = this;
        var name = document.getElementById("bName").value.trim().slice(0, 40);
        var color = document.getElementById("bColor").value.trim();
        var logo = document.getElementById("bLogo").value.trim();
        if (color && !/^#[0-9a-fA-F]{6}$/.test(color)) { HK.toast("Colour must look like #0e9591.", "error"); return; }
        if (logo && !/^https:\/\//.test(logo)) { HK.toast("The logo address must start with https://", "error"); return; }
        btn.disabled = true; btn.textContent = "Saving...";
        HK.orgRef().update({ "branding.appName": name, "branding.primaryColor": color, "branding.logoUrl": logo }).then(function () {
          HK.state.org.branding = { appName: name, primaryColor: color, logoUrl: logo };
          HK.audit("settings.changed", "Branding updated");
          HK.toast("Branding saved.", "success");
          setTimeout(function () { window.location.reload(); }, 700);
        }).catch(function (err) { btn.disabled = false; btn.textContent = "Save branding"; HK.toast("Save failed: " + err.message, "error"); });
      };
    }
    function renderExport(p) {
      var c = document.createElement("div"); c.className = "card"; c.innerHTML = "<div class=\"card-title\">Data export (GDPR)</div><p class=\"small muted mb16\">Download each collection as CSV.</p>";
      ["rooms", "assignments", "inspections", "deepcleans", "roomnotes", "documents"].forEach(function (col) { var b = document.createElement("button"); b.className = "btn btn-secondary btn-sm"; b.style.margin = "4px"; b.textContent = "Export " + col; b.onclick = function () { exportCol(col, b); }; c.appendChild(b); });
      p.appendChild(c);
    }
    function exportCol(col, btn) { btn.disabled = true; var old = btn.textContent; btn.textContent = "..."; HK.col(col).get().then(function (snap) { var rows = []; var keys = {}; snap.forEach(function (d) { var o = d.data(); Object.keys(o).forEach(function (k) { keys[k] = true; }); }); var cols = Object.keys(keys); rows.push(cols); snap.forEach(function (d) { var o = d.data(); rows.push(cols.map(function (k) { var v = o[k]; if (v && v.toDate) { v = v.toDate().toISOString(); } if (typeof v === "object") { v = JSON.stringify(v); } return v == null ? "" : v; })); }); var csv = rows.map(function (r) { return r.map(function (cc) { return "\"" + String(cc).replace(/\"/g, "\"\"") + "\""; }).join(","); }).join("\n"); var blob = new Blob([csv], { type: "text/csv" }); var url = URL.createObjectURL(blob); var a = document.createElement("a"); a.href = url; a.download = col + ".csv"; a.click(); URL.revokeObjectURL(url); btn.disabled = false; btn.textContent = old; }).catch(function (err) { btn.disabled = false; btn.textContent = old; HK.toast("Export failed: " + err.message, "error"); }); }
    function renderAudit(p) {
      var c = document.createElement("div"); c.className = "card";
      c.innerHTML = "<div class=\"card-title\">Audit log (read-only)</div>" +
        "<div class=\"row wrap mb16\">" +
        "<div class=\"field\" style=\"margin-bottom:0;\"><label class=\"tiny\">From</label><input type=\"date\" id=\"aFrom\"></div>" +
        "<div class=\"field\" style=\"margin-bottom:0;\"><label class=\"tiny\">To</label><input type=\"date\" id=\"aTo\"></div>" +
        "<div class=\"field grow\" style=\"margin-bottom:0;\"><label class=\"tiny\">Action contains</label><input id=\"aAction\" placeholder=\"e.g. room, user, inspection\"></div>" +
        "<button class=\"btn btn-sm btn-accent\" id=\"aApply\">Apply</button>" +
        "</div>" +
        "<div class=\"table-wrap\"><table><thead><tr><th>When</th><th>Action</th><th>Detail</th><th>Actor</th></tr></thead><tbody id=\"auditBody\"><tr><td colspan=\"4\">Loading...</td></tr></tbody></table></div>";
      p.appendChild(c);
      document.getElementById("aApply").onclick = loadAudit;
      loadAudit();
      function tsStart(s) { return firebase.firestore.Timestamp.fromDate(new Date(s + "T00:00:00")); }
      function tsEnd(s) { return firebase.firestore.Timestamp.fromDate(new Date(s + "T23:59:59")); }
      function loadAudit() {
        var from = document.getElementById("aFrom").value, to = document.getElementById("aTo").value;
        var action = (document.getElementById("aAction").value || "").trim().toLowerCase();
        var q = HK.orgRef().collection("auditlog");
        if (from) { q = q.where("createdAt", ">=", tsStart(from)); }
        if (to) { q = q.where("createdAt", "<=", tsEnd(to)); }
        q = q.orderBy("createdAt", "desc").limit(500);
        document.getElementById("auditBody").innerHTML = "<tr><td colspan=\"4\">Loading...</td></tr>";
        q.get().then(function (snap) {
          var tb = document.getElementById("auditBody"); tb.innerHTML = "";
          var shown = 0;
          snap.forEach(function (d) {
            var a = d.data();
            if (action && String(a.action || "").toLowerCase().indexOf(action) === -1) { return; }
            shown++;
            var tr = document.createElement("tr");
            tr.innerHTML = "<td class=\"tiny\">" + HK.fmtDateTime(a.createdAt) + "</td><td>" + HK.esc(a.action) + "</td><td>" + HK.esc(a.detail) + "</td><td>" + HK.esc(a.actorName) + "</td>";
            tb.appendChild(tr);
          });
          if (!shown) { tb.innerHTML = "<tr><td colspan=\"4\" class=\"muted\">No matching audit entries.</td></tr>"; }
        }).catch(function (err) { document.getElementById("auditBody").innerHTML = "<tr><td colspan=\"4\" class=\"muted\">" + HK.esc(err.message) + "</td></tr>"; });
      }
    }
  })();
  </script>
</body>
